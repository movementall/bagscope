<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bagscope · Phantom</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08090b; color: #f2f4f7; font: 15px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
      main { width: min(440px, calc(100vw - 32px)); padding: 32px; border-radius: 22px; background: #0f1114; border: 1px solid rgba(255, 255, 255, 0.08); }
      .logo { width: 44px; height: 44px; border-radius: 14px; background: #3dffa2; display: grid; place-items: center; color: #04130b; font-weight: 800; font-size: 20px; margin-bottom: 20px; }
      h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.02em; }
      p { margin: 0 0 14px; color: #8b93a1; }
      button { width: 100%; height: 46px; border: 0; border-radius: 12px; background: #3dffa2; color: #04130b; font: inherit; font-weight: 650; cursor: pointer; transition: transform 0.12s, opacity 0.12s; }
      button:hover { transform: translateY(-1px); }
      button:disabled { opacity: 0.5; cursor: default; transform: none; }
      .box { padding: 12px 14px; border-radius: 12px; background: #15181c; margin-bottom: 14px; word-break: break-all; font-size: 13px; }
      .ok { color: #3dffa2; } .err { color: #ff5c7a; }
      ul { padding: 0; margin: 0 0 14px; list-style: none; }
      li { padding: 10px 14px; border-radius: 12px; background: #15181c; margin-bottom: 6px; font: 13px ui-monospace, Consolas, monospace; display: flex; justify-content: space-between; gap: 8px; }
      small { display: block; margin-top: 16px; color: #5a616e; font-size: 12px; }
      a { color: #3dffa2; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">B</div>
      <h1 id="title">Connecting…</h1>
      <p id="text"></p>
      <div id="extra"></div>
      <button id="action" disabled>Loading</button>
      <small>Bagscope never sees your seed phrase or private keys. Phantom shows every request for you to approve or reject.</small>
    </main>
    <script type="module" src="./bridge/main.ts"></script>
  </body>
</html>
